<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5f0eb; --surface: #ffffff; --surface2: #ece5de;
  --accent: #6b7fa3; --accent2: #576d8e; --text: #3b2f2f;
  --text2: #7a6e6e; --border: #ddd4cb; --danger: #c0635e;
  --pink: #d4a5a5; --tan: #c4a882;
  --nav-h: 64px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }

/* Header */
.header { padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.header .subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* Pages */
.page { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.page.active { display: flex; }

/* Search bar */
.search-bar { padding: 12px 20px; flex-shrink: 0; }
.search-bar input {
  width: 100%; padding: 10px 16px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; outline: none;
}
.search-bar input::placeholder { color: var(--text2); }
.search-bar input:focus { border-color: var(--accent); }

/* Word list */
.word-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px 20px; }
.letter-header { font-size: 13px; font-weight: 700; color: var(--accent); padding: 12px 0 6px; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.word-card {
  background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  border: 1px solid var(--border); transition: border-color 0.2s;
}
.word-card:active { border-color: var(--accent); }
.word-card .word-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.word-card .word-def { font-size: 14px; color: var(--text2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.word-count { font-size: 12px; color: var(--text2); padding: 4px 0 8px; text-align: center; }

/* Daily page */
.daily-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
.daily-section { margin-bottom: 24px; }
.daily-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 10px; }
.daily-card {
  background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border);
}
.daily-card .word-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.daily-card .word-def { font-size: 15px; color: var(--text2); line-height: 1.55; }
.daily-card .word-origin { font-size: 12px; color: var(--text2); margin-top: 8px; font-style: italic; opacity: 0.7; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 10px;
  border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:active { background: var(--accent2); transform: scale(0.97); }
.btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn-outline:active { background: var(--accent); color: #fff; }
.btn-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn-danger:active { background: var(--danger); color: #fff; }
.btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.added-msg { color: var(--accent2); font-size: 14px; font-weight: 600; margin-top: 14px; }
.refresh-hint { font-size: 12px; color: var(--text2); margin-top: 6px; }
.loading { color: var(--text2); font-size: 14px; padding: 20px; text-align: center; }

/* Add page */
.add-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; outline: none; font-family: inherit;
}
.form-group textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-hint { font-size: 12px; color: var(--text2); margin-top: 4px; }
.form-msg { margin-top: 12px; font-size: 14px; padding: 10px 14px; border-radius: 8px; }
.form-msg.success { background: rgba(107,127,163,0.1); color: var(--accent2); }
.form-msg.error { background: rgba(231,76,60,0.1); color: var(--danger); }

/* Detail modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(59,47,47,0.4); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + var(--safe-bottom));
  width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal .handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal .word-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
.modal .word-def { font-size: 16px; color: var(--text2); line-height: 1.6; }

/* Nav */
nav {
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding: 6px 0 calc(6px + var(--safe-bottom)); flex-shrink: 0;
}
nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text2); font-size: 10px; font-weight: 600;
  padding: 8px 0; cursor: pointer; transition: color 0.2s;
}
nav button.active { color: var(--accent); }
nav button svg { width: 22px; height: 22px; }

/* Alphabet sidebar */
.alpha-sidebar {
  position: fixed; right: 2px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; z-index: 10; padding: 4px 0;
}
.alpha-sidebar span {
  font-size: 9px; font-weight: 700; color: var(--text2); padding: 1.5px 6px;
  text-align: center; cursor: pointer;
}
.alpha-sidebar span:active { color: var(--accent); }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state .big { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>Word Collection</h1>
  <div class="subtitle" id="wordCountHeader"></div>
</div>

<!-- Browse Page -->
<div class="page active" id="page-browse">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search words..." autocomplete="off">
  </div>
  <div class="word-list" id="wordList"></div>
  <div class="alpha-sidebar" id="alphaSidebar"></div>
</div>

<!-- Daily Page -->
<div class="page" id="page-daily">
  <div class="daily-content">
    <div class="daily-section">
      <div class="daily-label">Your Word of the Day</div>
      <div class="daily-card" id="myWordCard">
        <div class="loading">Loading...</div>
      </div>
    </div>
    <div class="daily-section">
      <div class="daily-label">Discover a New Word</div>
      <div class="daily-card" id="newWordCard">
        <div class="loading">Fetching from dictionary...</div>
      </div>
    </div>
  </div>
</div>

<!-- Known Words Page -->
<div class="page" id="page-known">
  <div class="search-bar">
    <input type="text" id="knownSearchInput" placeholder="Search known words..." autocomplete="off">
  </div>
  <div class="word-list" id="knownWordList"></div>
</div>

<!-- Add Page -->
<div class="page" id="page-add">
  <div class="add-content">
    <div class="form-group">
      <label>Word</label>
      <input type="text" id="addWord" placeholder="Enter a word" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Definition</label>
      <textarea id="addDef" placeholder="Enter definition (leave blank to auto-fetch)"></textarea>
      <div class="form-hint">Leave blank to automatically look up the definition</div>
    </div>
    <button class="btn btn-accent" id="addBtn" style="width:100%;justify-content:center;">Add to Collection</button>
    <div id="addMsg"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="handle"></div>
    <div class="word-title" id="modalWord"></div>
    <div class="word-def" id="modalDef"></div>
    <div class="btn-row">
      <button class="btn btn-danger" id="modalDelete">Delete</button>
    </div>
  </div>
</div>

<nav>
  <button class="active" data-page="browse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    Browse
  </button>
  <button data-page="daily">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
    Daily
  </button>
  <button data-page="known">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
    Known
  </button>
  <button data-page="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4h8"/></svg>
    Add
  </button>
</nav>

// ===== APP STATE =====
const STORAGE_KEY = 'wordCollection';
const DAILY_KEY = 'dailyWords';
const KNOWN_KEY = 'knownWords';
let words = [];
let knownWords = [];
let currentModalWord = null;
let currentModalSource = null; // 'collection' or 'known'

function loadWords() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    words = JSON.parse(stored);
  } else {
    words = INITIAL_WORDS.map(([word, definition]) => ({
      word, definition, added: Date.now()
    }));
    saveWords();
  }
}

function saveWords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  syncWordsToFirebase();
}

function syncWordsToFirebase() {
  const batch = {};
  words.forEach(w => { batch[w.word] = { definition: w.definition, added: w.added || Date.now() }; });
  db.collection('lists').doc('words').set({ items: batch }).catch(() => {});
}

function getWordsSorted() {
  return [...words].sort((a, b) => a.word.localeCompare(b.word, undefined, { sensitivity: 'base' }));
}

function loadKnownWords() {
  const stored = localStorage.getItem(KNOWN_KEY);
  knownWords = stored ? JSON.parse(stored) : [];
}

function saveKnownWords() {
  localStorage.setItem(KNOWN_KEY, JSON.stringify(knownWords));
  syncKnownToFirebase();
}

function syncKnownToFirebase() {
  const batch = {};
  knownWords.forEach(w => { batch[w.word] = { definition: w.definition, added: w.added || Date.now() }; });
  db.collection('lists').doc('known').set({ items: batch }).catch(() => {});
}

function getKnownSorted() {
  return [...knownWords].sort((a, b) => a.word.localeCompare(b.word, undefined, { sensitivity: 'base' }));
}

document.querySelectorAll('nav button').forEach(btn => {

// ===== BROWSE PAGE =====
function renderWordList(filter = '') {
  const list = document.getElementById('wordList');
  const sorted = getWordsSorted();
  const filtered = filter
    ? sorted.filter(w => w.word.toLowerCase().includes(filter.toLowerCase()) || w.definition.toLowerCase().includes(filter.toLowerCase()))
    : sorted;

  document.getElementById('wordCountHeader').textContent = `${words.length} words`;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big">~</div>No words found</div>';
    return;
  }

  let html = '';
  let currentLetter = '';
  filtered.forEach(w => {
    const letter = w.word[0].toUpperCase();
    if (letter !== currentLetter) {
      currentLetter = letter;
      html += `<div class="letter-header" id="letter-${letter}">${letter}</div>`;
    }
    html += `<div class="word-card" data-word="${encodeURIComponent(w.word)}">
      <div class="word-title">${esc(w.word)}</div>
      <div class="word-def">${esc(w.definition)}</div>
    </div>`;
  });
  list.innerHTML = html;

  list.querySelectorAll('.word-card').forEach(card => {
    card.addEventListener('click', () => {
      const wordName = decodeURIComponent(card.dataset.word);
      const w = words.find(x => x.word === wordName);
      if (w) openModal(w);
    });
  });

  renderAlphaSidebar(filtered);
}

function renderAlphaSidebar(filtered) {
  const sidebar = document.getElementById('alphaSidebar');
  const letters = [...new Set(filtered.map(w => w.word[0].toUpperCase()))].sort();
  sidebar.innerHTML = letters.map(l => `<span data-letter="${l}">${l}</span>`).join('');
  sidebar.querySelectorAll('span').forEach(s => {
    s.addEventListener('click', () => {
      const el = document.getElementById('letter-' + s.dataset.letter);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  renderWordList(e.target.value);
});

// ===== MODAL =====
function openModal(w, source) {
  currentModalWord = w;
  currentModalSource = source || 'collection';
  document.getElementById('modalWord').textContent = w.word;
  document.getElementById('modalDef').textContent = w.definition;
  const delBtn = document.getElementById('modalDelete');
  delBtn.textContent = currentModalSource === 'known' ? 'Remove' : 'Delete';
  document.getElementById('modal').classList.add('active');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('active');
  }
});

document.getElementById('modalDelete').addEventListener('click', () => {
  if (!currentModalWord) return;
  const label = currentModalSource === 'known' ? 'Remove' : 'Delete';
  if (confirm(`${label} "${currentModalWord.word}"?`)) {
    if (currentModalSource === 'known') {
      knownWords = knownWords.filter(w => w.word !== currentModalWord.word);
      saveKnownWords();
      renderKnownList(document.getElementById('knownSearchInput').value);
    } else {
      words = words.filter(w => w.word !== currentModalWord.word);
      saveWords();
      renderWordList(document.getElementById('searchInput').value);
    }
    document.getElementById('modal').classList.remove('active');
  }
});

function getDailyData() {
  const today = new Date().toISOString().slice(0, 10);
  const stored = localStorage.getItem(DAILY_KEY);
  if (stored) {
    const data = JSON.parse(stored);
    if (data.date === today) return data;
  }
  return null;
}

function saveDailyData(data) {
  localStorage.setItem(DAILY_KEY, JSON.stringify(data));
}

function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) {
    h = Math.imul(31, h) + seed.charCodeAt(i) | 0;
  }
  return Math.abs(h);
}

async function loadDailyPage() {
  const today = new Date().toISOString().slice(0, 10);
  let data = getDailyData();

  // My word of the day
  const myCard = document.getElementById('myWordCard');
  if (words.length === 0) {
    myCard.innerHTML = '<div class="word-def">Add some words to see your daily word!</div>';
  } else {
    const idx = seededRandom(today + 'my') % words.length;
    const w = getWordsSorted()[idx % getWordsSorted().length];
    myCard.innerHTML = `
      <div class="word-title">${esc(w.word)}</div>
      <div class="word-def">${esc(w.definition)}</div>
    `;
  }

  // New word suggestion
  const newCard = document.getElementById('newWordCard');

  if (data && data.suggestion) {
    renderSuggestion(newCard, data.suggestion);
  } else {
    await fetchNewSuggestion(newCard);
  }
}

function renderSuggestion(card, suggestion) {
  const alreadyHave = words.some(w => w.word.toLowerCase() === suggestion.word.toLowerCase());
  const alreadyKnown = knownWords.some(w => w.word.toLowerCase() === suggestion.word.toLowerCase());
  card.innerHTML = `
    <div class="word-title">${esc(suggestion.word)}</div>
    ${suggestion.phonetic ? `<div class="word-origin">${esc(suggestion.phonetic)}</div>` : ''}
    <div class="word-def">${esc(suggestion.definition)}</div>
    <div class="btn-row">
      ${alreadyHave
        ? '<div class="added-msg">Already in your collection</div>'
        : '<button class="btn btn-accent" id="addSuggestionBtn">Add to Collection</button>'
      }
      ${alreadyKnown
        ? ''
        : '<button class="btn btn-outline" id="knowSuggestionBtn" style="border-color:var(--tan);color:var(--tan);">Already Know This</button>'
      }
      <button class="btn btn-outline" id="newSuggestionBtn">New Word</button>
    </div>
  `;
  if (!alreadyHave) {
    document.getElementById('addSuggestionBtn')?.addEventListener('click', () => {
      words.push({ word: suggestion.word, definition: suggestion.definition, added: Date.now() });
      saveWords();
      renderWordList(document.getElementById('searchInput').value);
      renderSuggestion(card, suggestion);
    });
  }
  if (!alreadyKnown) {
    document.getElementById('knowSuggestionBtn')?.addEventListener('click', () => {
      knownWords.push({ word: suggestion.word, definition: suggestion.definition, added: Date.now() });
      saveKnownWords();
      fetchNewSuggestion(card);
    });
  }
  document.getElementById('newSuggestionBtn')?.addEventListener('click', () => fetchNewSuggestion(card));
}

async function fetchNewSuggestion(card) {
  card.innerHTML = '<div class="loading">Fetching a new word...</div>';
  const skipSet = new Set([
    ...words.map(w => w.word.toLowerCase()),
    ...knownWords.map(w => w.word.toLowerCase())
  ]);
  const candidates = RANDOM_WORDS_FOR_DISCOVERY.filter(w => !skipSet.has(w.toLowerCase()));
  const pool = candidates.length > 0 ? candidates : RANDOM_WORDS_FOR_DISCOVERY;
  const tried = new Set();
  for (let attempt = 0; attempt < 5; attempt++) {
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); } while (tried.has(idx) && tried.size < pool.length);
    tried.add(idx);
    const randomWord = pool[idx];
    try {
      const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${randomWord}`);
      if (!resp.ok) continue;
      const json = await resp.json();
      const entry = json[0];
      const meaning = entry.meanings[0];
      const suggestion = {
        word: entry.word.charAt(0).toUpperCase() + entry.word.slice(1),
        definition: `(${meaning.partOfSpeech}) ${meaning.definitions[0].definition}`,
        phonetic: entry.phonetic || ''
      };
      const today = new Date().toISOString().slice(0, 10);
      saveDailyData({ date: today, suggestion });
      renderSuggestion(card, suggestion);
      return;
    } catch {
      continue;
    }
  }
  card.innerHTML = `
    <div class="word-def" style="color:var(--text2)">Could not fetch word. Check your connection.</div>
    <div class="btn-row">
      <button class="btn btn-outline" id="retrySuggestionBtn">Retry</button>
    </div>
  `;
  document.getElementById('retrySuggestionBtn')?.addEventListener('click', () => fetchNewSuggestion(card));
}

// ===== KNOWN WORDS PAGE =====
function renderKnownList(filter = '') {
  const list = document.getElementById('knownWordList');
  const sorted = getKnownSorted();
  const filtered = filter
    ? sorted.filter(w => w.word.toLowerCase().includes(filter.toLowerCase()) || w.definition.toLowerCase().includes(filter.toLowerCase()))
    : sorted;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big">~</div>' +
      (knownWords.length === 0 ? 'Words you already know will appear here' : 'No words found') + '</div>';
    renderAlphaSidebar([]);
    return;
  }

  let html = `<div class="word-count">${knownWords.length} known words</div>`;
  let currentLetter = '';
  filtered.forEach(w => {
    const letter = w.word[0].toUpperCase();
    if (letter !== currentLetter) {
      currentLetter = letter;
      html += `<div class="letter-header" id="letter-${letter}">${letter}</div>`;
    }
    html += `<div class="word-card" data-word="${encodeURIComponent(w.word)}">
      <div class="word-title">${esc(w.word)}</div>
      <div class="word-def">${esc(w.definition)}</div>
    </div>`;
  });
  list.innerHTML = html;

  list.querySelectorAll('.word-card').forEach(card => {
    card.addEventListener('click', () => {
      const wordName = decodeURIComponent(card.dataset.word);
      const w = knownWords.find(x => x.word === wordName);
      if (w) openModal(w, 'known');
    });
  });

  renderAlphaSidebar(filtered);
}

document.getElementById('knownSearchInput').addEventListener('input', e => {
  renderKnownList(e.target.value);
});

// ===== ADD PAGE =====
document.getElementById('addBtn').addEventListener('click', async () => {
  const wordInput = document.getElementById('addWord');
  const defInput = document.getElementById('addDef');
  const msgEl = document.getElementById('addMsg');
  const word = wordInput.value.trim();
  let definition = defInput.value.trim();

  if (!word) {
    msgEl.innerHTML = '<div class="form-msg error">Please enter a word</div>';
    return;
  }

  if (words.some(w => w.word.toLowerCase() === word.toLowerCase())) {
    msgEl.innerHTML = '<div class="form-msg error">This word is already in your collection</div>';
    return;
  }

  if (!definition) {
    msgEl.innerHTML = '<div class="form-msg" style="color:var(--text2)">Looking up definition...</div>';
    try {
      const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (!resp.ok) throw new Error('not found');
      const json = await resp.json();
      const meaning = json[0].meanings[0];
      definition = `(${meaning.partOfSpeech}) ${meaning.definitions[0].definition}`;
      defInput.value = definition;
    } catch {
      msgEl.innerHTML = '<div class="form-msg error">Could not find definition. Please enter one manually.</div>';
      return;
    }
  }

  words.push({ word, definition, added: Date.now() });
  saveWords();
  renderWordList(document.getElementById('searchInput').value);

  wordInput.value = '';
  defInput.value = '';
  msgEl.innerHTML = `<div class="form-msg success">Added "${word}" to your collection!</div>`;
  setTimeout(() => { msgEl.innerHTML = ''; }, 3000);
});

// ===== UTILS =====
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== FIREBASE REAL-TIME SYNC =====
function startFirebaseSync() {
  // Listen for word collection changes
  db.collection('lists').doc('words').onSnapshot(doc => {
    if (!doc.exists) {
      // First time: push local words to Firebase
      syncWordsToFirebase();
      return;
    }
    const items = doc.data().items || {};
    const firebaseWords = Object.entries(items).map(([word, data]) => ({
      word, definition: data.definition, added: data.added || Date.now()
    }));
    // Replace local with Firebase (Firebase is the source of truth)
    const localSet = new Set(words.map(w => w.word.toLowerCase()));
    const fbSet = new Set(firebaseWords.map(w => w.word.toLowerCase()));
    const changed = words.length !== firebaseWords.length ||
      firebaseWords.some(w => !localSet.has(w.word.toLowerCase())) ||
      words.some(w => !fbSet.has(w.word.toLowerCase()));
    if (changed) {
      words = firebaseWords;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
      renderWordList(document.getElementById('searchInput').value);
    }
  }, () => {});

  // Listen for known words changes
  db.collection('lists').doc('known').onSnapshot(doc => {
    if (!doc.exists) {
      syncKnownToFirebase();
      return;
    }
    const items = doc.data().items || {};
    const firebaseKnown = Object.entries(items).map(([word, data]) => ({
      word, definition: data.definition, added: data.added || Date.now()
    }));
    const localSet = new Set(knownWords.map(w => w.word.toLowerCase()));
    const fbSet = new Set(firebaseKnown.map(w => w.word.toLowerCase()));
    const changed = knownWords.length !== firebaseKnown.length ||
      firebaseKnown.some(w => !localSet.has(w.word.toLowerCase())) ||
      knownWords.some(w => !fbSet.has(w.word.toLowerCase()));
    if (changed) {
      knownWords = firebaseKnown;
      localStorage.setItem(KNOWN_KEY, JSON.stringify(knownWords));
      renderKnownList(document.getElementById('knownSearchInput').value);
    }
  }, () => {});
}

// ===== INIT =====
loadWords();
loadKnownWords();
renderWordList();
startFirebaseSync();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
